assembly:
  - part: rear_shell
    travel_mm: 0
    held_by: base
    note: "Base CNC aluminum rear housing"
  - part: battery
    direction: [0, 0, -1]
    travel_mm: 20
    may_touch: [rear_shell]
    held_by: captured
    note: "1S 1300mAh LiPo battery seated into rear_shell pocket, captured beneath pcba"
  - part: pcba
    direction: [0, 0, -1]
    travel_mm: 25
    may_touch: [rear_shell]
    held_by: captured
    note: "Main PCBA lowered onto rear_shell standoffs and captured by front_shell bosses"
  - part: display
    direction: [0, 0, -1]
    travel_mm: 25
    may_touch: [pcba, rear_shell]
    held_by: captured
    note: "2.4-inch IPS TFT module seated above upper half of pcba and captured under front_shell"
  - part: shoulder_buttons
    direction: [0, 0, -1]
    travel_mm: 15
    may_touch: [rear_shell, pcba]
    held_by: captured
