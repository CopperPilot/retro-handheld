      name: 2.4-inch display window
      kind: display
      view: front
      center_mm: [31.5, 27.14]
      size_mm: [57.13, 46.79]
      implement: purchased
      source: photo
      confidence: high
      notes: "Measured region #1 in inputs/front.jpg (57.13 x 46.79 mm cover window over 2.4-inch 4:3 IPS panel)"
