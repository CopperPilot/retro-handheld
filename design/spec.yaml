fab:
  profile: jlcpcb
  layers: 2
  thickness_mm: 1.6
  assembly_sides: [top]
electrical:
  mcu: "STM32F412RET6 (LCSC C89374, LQFP-64, 100 MHz Cortex-M4F, 512 KB Flash, 256 KB contiguous SRAM, USB 2.0 FS, SPI)"
  power: "USB-C 5V input with 5.1k CC1/CC2 pull-downs and USBLC6-2SC6 ESD protection -> TP4056 1S LiPo charger (780 mA) + AO3401A/B5819W load-sharing power path -> RT6150AGQW 3.3V 800mA synchronous buck-boost regulator"
  blocks:
    - id: power
      purpose: "USB-C 5V receptacle J1 with 5.1k CC pull-downs, USBLC6-2SC6 ESD array, TP4056 1S Li-Ion charger U2, AO3401A P-MOSFET Q1 + B5819W Schottky D1 load-sharing path from J3 battery connector, and RT6150AGQW 3.3V synchronous buck-boost converter U3 with 2.2uH inductor L1"
      key_parts: [TYPE-C-31-M-12, USBLC6-2SC6, TP4056, AO3401A, B5819W SL, RT6150AGQW, SWPA3015S2R2MT, "532610271"]
      reference: "STMicroelectronics AN4488 & Richtek RT6150A datasheet application circuit"
    - id: mcu
      purpose: "STM32F412RET6 MCU U1 with 12 MHz HSE crystal Y1 (X322512MSB4SI), 2.2uF VCAP_1 capacitor, 10k NRST pull-up, 10k BOOT0 pull-down for normal boot / USB DFU flashing over PA11/PA12"
      key_parts: [STM32F412RET6, X322512MSB4SI]
      reference: "STMicroelectronics AN2606 & STM32F412RET6 datasheet hardware getting started guide"
    - id: display
      purpose: "18-pin 0.5mm pitch FPC connector J2 (FH12-18S-0.5SH(55)) driving 2.4-inch 320x240 ILI9341 IPS TFT LCD over 4-wire SPI1 (PA4 CS, PA5 SCK, PA7 MOSI, PA6 DC, PC4 RESET) plus 2N7002 MOSFET Q2 PWM backlight driver on PB0 (TIM3_CH3) with 5.1 ohm current-limiting resistor from +3V3"
      key_parts: [FH12-18S-0.5SH(55), 2N7002]
      reference: "BuyDisplay ER-TFT024-3 2.4-inch 18-pin 4-wire SPI IPS TFT interfacing reference"
    - id: controls
      purpose: "10 top-actuated SMD tactile switches SW1..SW10 (Omron B3U-1000P) for D-pad Up/Down/Left/Right, X, Y, A, B, Select, Start and 4 right-angle side-actuated SMD tactile switches SW11..SW14 (Omron B3U-3100P) for top shoulder buttons L1, L2, R2, R1 wired active-low to dedicated MCU GPIO pins"
      key_parts: [B3U-1000P, B3U-3100P]
      reference: "Omron B3U-1000P / B3U-3100P datasheet SPST active-low GPIO switch circuit"
  nets_must_connect:
    - ["J1.A4", "U2.VCC"]
    - ["J1.A6", "U4.1"]
    - ["J1.A7", "U4.3"]
    - ["U4.6", "U1.PA12"]
    - ["U4.4", "U1.PA11"]
    - ["U2.BAT", "J3.1"]
    - ["U3.LX1", "L1.1"]
    - ["U3.LX2", "L1.2"]
    - ["U3.VOUT", "U1.VDD"]
    - ["U1.PA5", "J2.9"]
    - ["U1.PA7", "J2.10"]
    - ["U1.PB0", "Q2.1"]
  high_speed:
    - name: usb_fs_diff
      board: main
      nets: ["USB_DP", "USB_DM", "USB_D+", "USB_D-"]
      kind: diff_pairs
      tolerance_mm: 2.0
      diff_impedance_ohm: 90.0
      source: "STMicroelectronics AN4879 USB hardware and PCB guidelines for STM32 MCUs (90 ohm differential)"
board:
  width_mm: 58.0
  height_mm: 76.0
  corner_radius_mm: 2.0
  mounting_holes:
    - {x_mm: 4.0, y_mm: 47.0, drill_mm: 2.2, plated: true}
    - {x_mm: 54.0, y_mm: 47.0, drill_mm: 2.2, plated: true}
    - {x_mm: 4.0, y_mm: 72.5, drill_mm: 2.2, plated: true}
    - {x_mm: 54.0, y_mm: 72.5, drill_mm: 2.2, plated: true}
  placement:
    - {ref: SW1, role: dpad_up, side: top, x_mm: 11.58, y_mm: 52.63, rot_deg: 0, feature: F_DPAD_UP, tolerance_mm: 1.0}
    - {ref: SW2, role: dpad_down, side: top, x_mm: 11.58, y_mm: 65.63, rot_deg: 0, feature: F_DPAD_DOWN, tolerance_mm: 1.0}
    - {ref: SW3, role: dpad_left, side: top, x_mm: 5.08, y_mm: 59.13, rot_deg: 0, feature: F_DPAD_LEFT, tolerance_mm: 1.0}
    - {ref: SW4, role: dpad_right, side: top, x_mm: 18.08, y_mm: 59.13, rot_deg: 0, feature: F_DPAD_RIGHT, tolerance_mm: 1.0}
    - {ref: SW5, role: btn_x, side: top, x_mm: 45.46, y_mm: 53.36, rot_deg: 0, feature: F_BTN_X, tolerance_mm: 1.0}
    - {ref: SW6, role: btn_y, side: top, x_mm: 38.82, y_mm: 59.64, rot_deg: 0, feature: F_BTN_Y, tolerance_mm: 1.0}
    - {ref: SW7, role: btn_a, side: top, x_mm: 51.99, y_mm: 59.79, rot_deg: 0, feature: F_BTN_A, tolerance_mm: 1.0}
    - {ref: SW8, role: btn_b, side: top, x_mm: 45.36, y_mm: 66.17, rot_deg: 0, feature: F_BTN_B, tolerance_mm: 1.0}
    - {ref: SW9, role: btn_select, side: top, x_mm: 24.59, y_mm: 67.84, rot_deg: 0, feature: F_BTN_SE, tolerance_mm: 1.0}  # placed on PCB at (24.59, 66.85), spanning Y=-68.10..-65.60 mm (1.03 mm clear North of J1 rear edge at Y=-69.13 mm)
    - {ref: SW10, role: btn_start, side: top, x_mm: 32.65, y_mm: 67.84, rot_deg: 0, feature: F_BTN_ST, tolerance_mm: 1.0}  # placed on PCB at (32.65, 66.85), spanning Y=-68.10..-65.60 mm (1.03 mm clear North of J1 rear edge at Y=-69.13 mm)
    - {ref: SW11, role: btn_l1, side: top, x_mm: 6.0, y_mm: 2.2, rot_deg: 0, feature: F_BTN_L1, tolerance_mm: 1.0, mates: "-y", mates_source: "Omron B3U-3100P KiCad footprint: plunger tip at y=-2.77 mm (-y board / +Y world) at rot_deg=0"}
    - {ref: SW12, role: btn_l2, side: top, x_mm: 16.3, y_mm: 2.2, rot_deg: 0, feature: F_BTN_L2, tolerance_mm: 1.0, mates: "-y", mates_source: "Omron B3U-3100P KiCad footprint: plunger tip at y=-2.77 mm (-y board / +Y world) at rot_deg=0"}
    - {ref: SW13, role: btn_r2, side: top, x_mm: 41.7, y_mm: 2.2, rot_deg: 0, feature: F_BTN_R2, tolerance_mm: 1.0, mates: "-y", mates_source: "Omron B3U-3100P KiCad footprint: plunger tip at y=-2.77 mm (-y board / +Y world) at rot_deg=0"}
    - {ref: SW14, role: btn_r1, side: top, x_mm: 52.0, y_mm: 2.2, rot_deg: 0, feature: F_BTN_R1, tolerance_mm: 1.0, mates: "-y", mates_source: "Omron B3U-3100P KiCad footprint: plunger tip at y=-2.77 mm (-y board / +Y world) at rot_deg=0"}
    - {ref: J1, role: usb_c, side: top, x_mm: 29.0, y_mm: 73.2, rot_deg: 0, feature: F_USBC, tolerance_mm: 1.0, mates: "+y", mates_source: "HRO TYPE-C-31-M-12 KiCad footprint: receptacle mouth at y=+3.65 mm (+y board / -Y world) at rot_deg=0"}  # placed on PCB at (29.00, 74.18), spanning X=24.53..33.47, Y=-77.03..-69.13 mm (1.03 mm clear South of SW9/SW10)
    - {ref: J2, role: display_fpc, side: top, x_mm: 29.0, y_mm: 2.9, rot_deg: 180, tolerance_mm: 1.5, mates: "-y", mates_source: "Hirose FH12-18S-0.5SH KiCad footprint: FPC mouth at y=+4.4 mm at rot_deg=0, so at rot_deg=180 mouth faces -y (top board edge)"}
    - {ref: J3, role: battery_conn, side: top, x_mm: 41.0, y_mm: 73.2, rot_deg: 0, tolerance_mm: 1.5, mates: "+y", mates_source: "Molex PicoBlade 53261-0271 Horizontal KiCad footprint: shroud mouth at y=+2.6 mm (+y board / -Y world, facing bottom board edge) at rot_deg=0"}
  max_component_height_mm:
    top: 5.0
    bottom: 2.0
bom:
  - {refs: [U1], role: mcu, mpn: STM32F412RET6, lcsc: C89374, footprint: "Package_QFP:LQFP-64_10x10mm_P0.5mm", description: "100 MHz ARM Cortex-M4F MCU with 512 KB Flash and 256 KB SRAM, with single VCAP_1 pin (U1.30) decoupled by C10 = 4.7uF 16V 0603 X5R low-ESR ceramic capacitor (CL10A475KO8NNNC, LCSC C19666) per ST DS11139 Table 21 / AN4488, analog supply pin VDDA/VREF+ (U1.13) isolated from digital +3V3 via ferrite bead L2 (BLM18PG121SN1D, LCSC C14709, 120 Ohm @ 100 MHz) with local decoupling C21=100nF (C307331) + C22=1uF (C29266), USB-C CC1/CC2 voltage sensing on U1.14 (PA0 / ADC1_IN0 on /USB_CC1_ADC) and U1.27 (PB1 / ADC1_IN9 on /USB_CC2_ADC) through R52/R53=10kOhm (0402WGF1002TCE C25744) series current-limiting resistors, and TP4056 charger enable control on U1.54 (PD2 / CHG_CE with R51=100k pull-down)"}
  - {refs: [Y1], role: crystal, mpn: X322512MSB4SI, lcsc: C9002, footprint: "Crystal:Crystal_SMD_3225-4Pin_3.2x2.5mm", description: "12 MHz 9 pF 60 Ohm SMD3225-4P crystal (TXM12M0004322CBCDO00T, LCSC C362368, gm_crit = 0.25 mA/V << 1.0 mA/V STM32F412 Gm_crit_max) with C1=C2=12 pF 50V C0G load capacitors (0402CG120J500NT, LCSC C1547, CL_actual = 6 pF + 3 pF = 9 pF) for HSE and USB DFU"}
  - {refs: [J1], role: usb_c, mpn: TYPE-C-31-M-12, lcsc: C165948, footprint: "Connector_USB:USB_C_Receptacle_HRO_TYPE-C-31-M-12", description: "16-pin USB-C receptacle for charging and USB DFU, placed at (29.00, 74.18) on F.Cu (spanning X=24.53..33.47, Y=-77.03..-69.13 mm, with 1.03 mm physical separation South of SW9/SW10 at Y=-68.10..-65.60 mm)"}
  - {refs: [U4], role: usb_esd, mpn: USBLC6-2SC6, lcsc: C2687116, footprint: "Package_TO_SOT_SMD:SOT-23-6", description: "USB 2.0 ESD protection array for D+/D- (rail pin on VBUS), placed immediately adjacent to J1 (28.62, 65.00) alongside F1 (BSMD0805-110-12V C910824 PTC polyfuse at 21.50, 74.00), C3 (100nF VBUS_IN bypass at 21.50, 72.20), D3 (SD05 C502527 5V 350W VBUS surge TVS at 17.20, 74.00), D4 (PESD5V0S2BT C2687130 dual 5V low-clamping bidirectional CC1/CC2 ESD TVS at 20.20, 70.50, VRWM=5.0V, VBR=6.0-7.2V), and R1/R2 (5.1k CC pull-downs at 16.80, 71.00/69.50 sensed by U1.PA0/ADC1_IN0 and U1.PB1/ADC1_IN9 via R52/R53=10kOhm 0402WGF1002TCE C25744 series current-limiting resistors on /USB_CC1_ADC and /USB_CC2_ADC)"}
  - {refs: [U2], role: battery_charger, mpn: TP4056, lcsc: C725790, footprint: "Package_SO:SOIC-8-1EP_3.9x4.9mm_P1.27mm_EP2.29x3mm", description: "1A linear 1S Li-Ion battery charger IC configured via R3=3.3kOhm (0402WGF3301TCE C25890) on PROG for I_CHG=363.6mA (0.30C for 1200mAh cell, P_diss<=0.71W; top-level electrical.power is a scope-locked field) with U2.8 (CE) driven by MCU GPIO U1.54 (PD2) on /CHG_CE with R51=100kOhm (0402WGF1003TCE C25741) pull-down to /GND (keeping U2 off prior to USB enumeration for ~40.6mA <= 100mA unconfigured draw, and total configured SDP draw at 363.6+40.6+64.0=468.2mA typ / 480.2mA max <= 500mA) and C4=4.7uF VBUS bypass (total VBUS+VSYS bypass 9.6uF <= 10uF USB 2.0 spec)"}
  - {refs: [Q1], role: power_path_pfet, mpn: AO3401A, lcsc: C15127, footprint: "Package_TO_SOT_SMD:SOT-23", description: "30V 4A P-channel MOSFET for USB/battery load sharing (Q1), soft-power latch (Q3, with C20=100nF C307331 connected across Q3 Source /VSYS to Gate /PWR_GATE to prevent battery-insertion auto-turn-on), J3 battery reverse-polarity protection (Q6 at 47.80, 71.20 adjacent to J3 with F2 BSMD0805-110-12V at 47.80, 74.20, R20=100k source-gate clamp at 47.80, 68.80, Q7 AO3400A C20917 gate enable at 49.50, 65.20 biased from /VSYS via R31=100k C25741 at 50.80, 67.80 for 0V PCM-tripped pack wake-up, and Q11 AO3400A C20917 negative-polarity clamp at 54.20, 68.50 feeding R30=10k C25744 at 50.80, 69.20), +3V3-gated high-side VBAT ADC switch (Q8), manual-reset (/NRST) soft-latch hold-up switch (Q10, Source on +3V3, Gate on NRST, Drain on NRST_HOLD in parallel with D5 BAT54C dual Schottky diode from +3V3 and BOOT0 feeding R49=100k C25741 into PWR_HOLD), and external button-chord DFU BOOT0 high-side series switches (Q12 gated by /BTN_SELECT and Q13 gated by /BTN_R2 from +3V3 to /BOOT0)"}
  - {refs: [D1], role: power_path_diode, mpn: "B5819W SL", lcsc: C8598, footprint: "Diode_SMD:D_SOD-123", description: "40V 1A Schottky barrier diode for VBUS load sharing into VSYS (C6=4.7uF + C9=100nF)"}
