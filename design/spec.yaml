  - {refs: [L1], role: power_inductor, mpn: SWPA3015S2R2MT, lcsc: C43389, footprint: "Inductor_SMD:L_Sunlord_SWPA3015S", description: "2.2 uH 2A shielded power inductor for RT6150AGQW"}
