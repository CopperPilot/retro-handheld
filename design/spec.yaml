    travel_mm: 25
    may_touch: [pcba]
    held_by: captured
    note: "Select and Start buttons seated over SW9..SW10 and captured by front_shell cutout flanges"
  - part: front_shell
    direction: [0, 0, -1]
    travel_mm: 30
    may_touch: [rear_shell, pcba, display, shoulder_buttons, dpad, action_buttons, start_select_buttons]
