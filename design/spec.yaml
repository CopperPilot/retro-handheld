schema_version: rea-hardware/spec/v1
product:
  slug: pocket-retro-handheld
  name: Pocket Retro Game Console
  summary: "Ultra-compact vertical metal handheld console with 2.4-inch IPS LCD, D-pad, ABXY/Start/Select/L1/L2/R1/R2 controls, 1S LiPo battery, and USB-C charging"
  category: handheld game console
inputs:
  images:
    - inputs/front.jpg
    - inputs/front_and_rear.jpg
    - inputs/front_in_hand.jpg
    - inputs/rear.jpg
  prompt: inputs/prompt.md
  views:
    front: inputs/front.jpg
    rear: inputs/rear.jpg
envelope:
  width_mm: 63.0
  height_mm: 81.0
  depth_mm: 17.0
  corner_radius_mm: 2.5
  derivation: "Published specifications for this 2.4-inch vertical metal handheld class list 63 x 81 x 17 mm (h/w = 1.2857); rea_hardware measure on inputs/front.jpg at --width-mm 63 gives 63.0 x 81.1 mm (h/w = 1.2878) and inputs/rear.jpg gives 63.0 x 81.2 mm (h/w = 1.2888)."
  front_origin_world_mm: [-2.5, 2.5, 12.75]
fidelity:
  out_of_scope:
    - printed front indicator graphic bars above Select/Start
    - rear regulatory silkscreen text
    - 3.5 mm headphone jack and microSD slot not shown in photos or requested in prompt
  dimensions:
    - {name: body_width, kind: overall_width, value_mm: 63.0, tol_mm: 1.0, source: "Published spec 63 x 81 x 17 mm and rea_hardware measure inputs/front.jpg --width-mm 63"}
    - {name: body_height, kind: overall_height, value_mm: 81.0, tol_mm: 1.0, source: "Published spec 63 x 81 x 17 mm and rea_hardware measure inputs/front.jpg (81.1 mm)"}
    - {name: body_depth, kind: overall_depth, value_mm: 17.0, tol_mm: 1.0, source: "Published spec 63 x 81 x 17 mm"}
    - {name: plan_corner_radius, kind: corner_radius, value_mm: 2.5, tol_mm: 0.8, source: "Measured outer corner radius on inputs/front.jpg and inputs/rear.jpg"}
    - {name: display_bezel, kind: bezel, value_mm: 2.94, tol_mm: 0.8, source: "rea_hardware measure inputs/front.jpg: (63.0 - 57.13) / 2 = 2.94 mm side bezel around 57.13 x 46.79 mm cover glass"}
    - {name: edge_thickness, kind: edge_thickness, value_mm: 15.5, tol_mm: 1.5, source: "17.0 mm body depth minus 0.75 mm front/rear perimeter chamfers"}
    - {name: center_thickness, kind: center_thickness, value_mm: 17.0, tol_mm: 1.0, source: "Published spec 17.0 mm full body thickness"}
