requirements:
  - id: R1
    text: "Handheld retro game console like the one in these photos"
    how_met: "63 x 81 x 17 mm anodized CNC aluminum vertical handheld enclosure with 2.4-inch IPS display window, cross D-pad, diamond ABXY buttons, Select/Start buttons, 4 inline top shoulder buttons (L1/L2/R2/R1), rear vertical grip grooves, and lanyard holes matching the reference photos"
    quantity: "63 x 81 x 17 mm, 14 buttons + 2.4-inch display"
  - id: R2
    text: "Run simple 2D games"
    how_met: "STM32F412RET6 100 MHz ARM Cortex-M4F MCU (80 MHz SYSCLK/APB2, clocked from 12 MHz CL=9pF ESR=60Ohm crystal Y1 TXM12M0004322CBCDO00T with C1=C2=12pF C0G load capacitors, gm_crit=0.25mA/V << 1.0mA/V, single VCAP_1 pin U1.30 decoupled with C10=4.7uF 16V 0603 X5R CL10A475KO8NNNC C19666 per ST DS11139/AN4488, and U1.13 VDDA/VREF+ isolated from +3V3 via ferrite bead L2 BLM18PG121SN1D C14709 + C21=100nF/C22=1uF) with 512 KB Flash and 256 KB contiguous single-block SRAM holding a full 320x240 16-bit RGB565 frame buffer (150 KB) with 106 KB headroom for game logic and DMA-driven 10.0 MHz SPI1 dirty-rectangle updates (PA4 CS, PA5 SPI1_SCK, PA6 SPI1_MISO/LCD_SDO, PA7 SPI1_MOSI/LCD_SDA, PC5 LCD_DC, PC4 LCD_RST, meeting ILI9341 twc >= 100 ns limit) to the 18-pin 2.4-inch 320x240 IPS TFT display (Z240IT002 / YX240QV29-T with J2.16 IM1=+3V3, J2.17 IM2=+3V3, J2.18 IM0=GND setting IM[2:0]=110 for 4-wire 8-bit SPI, J2.12 LEDA powered from /VSYS, and J2.2..5 LEDK1..LEDK4 driven via four individual 100 Ohm 1% 0603 ballast resistors R9, R46, R47, R48 0603WAF1000T5E C22775 and AO3400A logic-level MOSFET Q2 on PB0 limiting backlight current to 16.0mA/LED typ and 19.5mA/LED max <= 25mA/LED), with all 14 buttons conditioned by external 10k pull-ups (R33..R45, R19) and dual 5V bidirectional ESD TVS arrays (D6..D12 PESD5V0S2BT)"
    quantity: "80-100 MHz Cortex-M4F, 256 KB SRAM, 10.0 MHz SPI1 DMA @ 60 fps"
  - id: R3
    text: "Charge over USB-C"
    how_met: "Bottom-edge 16-pin USB-C receptacle J1 (TYPE-C-31-M-12) with immediately adjacent protection: 5.1k CC1/CC2 pull-down resistors (R1, R2 at 16.80, 71.00/69.50 sensed through 10kOhm series current-limiting resistors R52, R53 0402WGF1002TCE C25744 on MCU ADC1 inputs U1.14 PA0/ADC1_IN0 /USB_CC1_ADC and U1.27 PB1/ADC1_IN9 /USB_CC2_ADC to detect Default/1.5A/3.0A Type-C source advertisement), PESD5V0S2BT dual 5V low-clamping bidirectional CC1/CC2 ESD TVS (D4 C2687130 at 20.20, 70.50, VRWM=5.0V, VBR=6.0-7.2V), USBLC6-2SC6 D+/D- ESD array (U4 at 28.62, 65.00), BSMD0805-110-12V 1.1A PTC polyfuse (F1 at 21.50, 74.00), SD05 5V 350W VBUS surge TVS (D3 at 17.20, 74.00), C3=100nF (21.50, 72.20) + C4=4.7uF VBUS bypass (total VBUS+VSYS capacitance 9.6uF <= 10uF USB 2.0 spec), TP4056 1S Li-Ion linear charger U2 (R3=3.3kOhm C25890 for 363.6mA charge current, with U2.8 CE controlled on /CHG_CE by U1.54 PD2 and pulled low by R51=100kOhm C25741 so U2 stays disabled prior to USB enumeration for ~40.6mA <= 100mA unconfigured draw and <= 480.2mA max configured SDP draw), J3 battery PTC polyfuse (F2 at 47.80, 74.20) + AO3401A reverse-polarity P-MOSFET (Q6 at 47.80, 71.20 with R20=100k source-gate clamp, Q7 AO3400A C20917 gate enable biased from /VSYS via R31=100k C25741 for 0V PCM-tripped battery wake-up, and Q11 AO3400A C20917 negative-polarity clamp at 54.20, 68.50 with R30=10k C25744), AO3401A/B5819W load-sharing power path, hardware-self-latching soft-power latch (Q3 AO3401A with C20=100nF across /VSYS-to-/PWR_GATE, Q4 AO3400A self-latched at 2.61V from /+3V3 and /BOOT0 via D5 BAT54C + R49=100k C25741 + R18=560k + C19=1uF + Q10 /NRST hold-up, and Q5 AO3400A AC-coupled via C23=1uF + R50=560k from /VBUS), unclamped VBUS_SNS divider (R23=5.1k/R24=10k, 3.31V nominal) to 5V-tolerant FT pin PA9 (U1.42), and +3V3-gated Q8/Q9 + 2x 10kOhm + 100nF VBAT ADC divider to PA2 (ADC1_IN2)"
    quantity: "5 V USB-C input, protected 1S LiPo charging, 9.6 uF total USB bypass"
decisions:
  - question: "MCU selection and memory sizing for 2D retro games on a 320x240 16-bit display?"
    choice: "STM32F412RET6 (LCSC C89374, LQFP-64, 100 MHz ARM Cortex-M4F, 512 KB Flash, 256 KB contiguous SRAM) with 12 MHz CL=9pF ESR=60Ohm HSE crystal Y1 (TXM12M0004322CBCDO00T, C362368), C1=C2=12pF C0G load capacitors (0402CG120J500NT, C1547), C10=4.7uF 0603 X5R VCAP_1 capacitor (CL10A475KO8NNNC, C19666), and L2 (BLM18PG121SN1D, C14709) + C21=100nF/C22=1uF VDDA filter"
    reason: "A 320x240 16-bit RGB565 frame buffer requires 153.6 KB (150 KB). Unlike STM32F405 where 64 KB of the 192 KB RAM is non-DMA CCM RAM, all 256 KB of SRAM on STM32F412RET6 is contiguous DMA-accessible SRAM, leaving 106 KB for sprites/audio/game state while streaming dirty-rectangle/tile updates via SPI1 DMA at 10.0 MHz (SYSCLK = 80 MHz, APB2/8 = 10.0 MHz, meeting ILI9341 4-wire SPI minimum write cycle twc = 100 ns / 10 MHz max, and APB2/16 = 5.0 MHz for read cycles within trc = 150 ns / 6.67 MHz max). Using a 12 MHz crystal with CL=9pF and ESR(max)=60 Ohm (TXM12M0004322CBCDO00T, C362368) gives gm_crit = 0.25 mA/V << Gm_crit_max = 1.0 mA/V (gain margin > 16), and sizing C1 = C2 = 12 pF (C1547) yields CL(actual) = 6 pF + 3 pF(stray) = 9.0 pF. Because the LQFP-64 package bonds out only a single VCAP_1 pin (U1.30), decoupling VCAP_1 with C10 = 4.7 uF 16V 0603 X5R (CL10A475KO8NNNC, C19666, ESR << 1 Ohm) satisfies ST DS11139 Table 21 and AN4488, and isolating U1.13 (VDDA/VREF+) from digital +3V3 with ferrite bead L2 (BLM18PG121SN1D, C14709) and C21=100nF + C22=1uF keeps analog ADC reference noise-free."
  - question: "Power path, input protection, and voltage regulation across full 1S LiPo discharge range (3.0 V to 4.2 V) and USB 5.0 V?"
    choice: "USB-C 5V J1 -> immediately adjacent C3=100nF (21.5, 72.2) + F1 (BSMD0805-110-12V 1.1A 12V PTC polyfuse, C910824 at 21.5, 74.0) + D3 (SD05 5V 350W surge TVS, C502527 at 17.2, 74.0) + U4 (USBLC6-2SC6 at 28.62, 65.0) + D4 (PESD5V0S2BT dual 5V low-clamping bidirectional CC1/CC2 ESD TVS, C2687130 at 20.2, 70.5, VRWM=5.0V, VBR=6.0-7.2V) + R1/R2 (5.1k CC pull-downs sensed through R52/R53=10kOhm 0402WGF1002TCE C25744 series current-limiting resistors on U1.PA0/ADC1_IN0 /USB_CC1_ADC and U1.PB1/ADC1_IN9 /USB_CC2_ADC) + C4=4.7uF on VBUS -> TP4056 charger (U2, R3=3.3kOhm C25890 for 363.6mA, with U2.8 CE controlled on /CHG_CE by U1.54 PD2 + R51=100k C25741 pull-down to /GND) + J3 battery connector protected immediately adjacent to J3 by F2 (BSMD0805-110-12V PTC polyfuse at 47.8, 74.2) and Q6 (AO3401A P-MOSFET reverse-polarity stage at 47.8, 71.2 with R20=100k source-gate clamp at 47.8, 68.8, Q7 AO3400A C20917 gate enable at 49.5, 65.2 biased from /VSYS via R31=100k C25741 at 50.8, 67.8, and Q11 AO3400A C20917 negative-polarity clamp at 54.2, 68.5 with R30=10k C25744 at 50.8, 69.2) -> AO3401A/B5819W load-sharing path (with C6=4.7uF + C9=100nF on VSYS so total VBUS+VSYS bypass is 9.6 uF <= 10 uF USB 2.0 limit) -> hardware-self-latching soft-power latch (Q3 AO3401A with C20=100nF across /VSYS-to-/PWR_GATE, Q4 AO3400A with C19=1uF + R18=560k + D5 BAT54C from /+3V3 and /BOOT0 + Q10 AO3401A /NRST hold-up feeding R49=100k C25741 into /PWR_HOLD, Q5 AO3400A AC-coupled via C23=1uF + R50=560k from /VBUS, D2 BAT54C) -> RT6150AGQW 3.30V buck-boost (U3) + Q8/Q9/R32 +3V3-gated R21/R22 (2x 10kOhm, R_th=5.0kOhm) & C18 (100nF) VBAT ADC divider to U1.PA2 (ADC1_IN2) and unclamped VBUS_SNS divider (R23=5.1k/R24=10k) to 5V-tolerant FT pin U1.PA9"
    reason: "Biasing Q7 Gate (/VBAT_RP_EN) from /VSYS through R31=100kOhm while clamping /VBAT_RP_EN to /VBAT_FUSED through R30=10kOhm and negative-polarity N-MOSFET Q11 (AO3400A, Gate on /GND, Source on /VBAT_FUSED, Drain on /VBAT_RP_CLAMP) solves 0V PCM-tripped battery recovery without sacrificing reverse-polarity protection: when a PCM-tripped pack is at 0V (/VBAT_FUSED = 0V) and USB is connected (/VSYS = 4.70V), Q11 has V_GS = 0V (off, body diode reverse-biased), so R31 pulls /VBAT_RP_EN to 4.70V, turning on Q7 and Q6 so U2 can deliver its 36.4mA trickle charge to reset the pack PCM; on battery-only operation (+2.5V..+4.2V), Q11's body diode conducts through R30=10k and R31=100k pulls from /VSYS to keep Q7/Q6 on; if a battery is inserted in reverse (-1.5V to -4.2V), Q11 turns on hard (V_GS = +1.5V..+4.2V > V_GS(th,max) = 1.45V) and pulls /VBAT_RP_EN negative (-0.91V to -3.37V against R31=100k from /VSYS <= 4.95V), holding Q7 and Q6 strictly off. Controlling U2.8 (CE) on /CHG_CE via U1.54 (PD2) with R51=100kOhm pull-down keeps U2 disabled (I_CC <= 55uA) upon USB plug-in and during reset/DFU so unconfigured /VBUS current is only ~40.6mA (<= 100mA USB 2.0 unconfigured limit). Sensing /USB_CC1 and /USB_CC2 through series 10kOhm current-limiting resistors R52 and R53 (0402WGF1002TCE C25744, total ADC source resistance R_AIN = 15.1kOhm <= 50kOhm STM32F412 DS11139 Table 65 limit) on U1.14 (PA0/ADC1_IN0 /USB_CC1_ADC) and U1.27 (PB1/ADC1_IN9 /USB_CC2_ADC) with 5V bidirectional TVS clamping at D4 (PESD5V0S2BT C2687130, VRWM=5.0V, VBR=6.0-7.2V, VCL<=12V at 3A, limiting MCU pin injection current to <= 1.2mA << 5mA rating) allows firmware to safely distinguish Default USB (0.41V) from 1.5A (0.92V) and 3.0A (1.68V) Type-C sources, and sizing R3=3.3kOhm (I_CHG=363.6mA) + R9/R46..R48=100Ohm (64.0mA typ / 78.0mA max backlight) keeps total play-while-charging /VBUS current at 468.2mA typ (480.2mA max at V_BUS=5.25V), strictly below the 500mA USB 2.0 SDP limit."
  - question: "Display interface, 18-pin FPC contact orientation, SPI1 pin muxing, and backlight drive path?"
    choice: "2.4-inch 320x240 IPS SPI TFT panel (18-pin 0.5mm pitch ZIF SPI ILI9341 module Z240IT002 / YX240QV29-T) via bottom-contact 18-pin 0.5mm FPC connector J2 (FH12-18S-0.5SH(55) at rot_deg=180 on F.Cu), wired to hardware SPI1 on U1 (PA4=LCD_CS, PA5=SPI1_SCK/LCD_SCK, PA6=SPI1_MISO/LCD_SDO, PA7=SPI1_MOSI/LCD_SDA, dedicated GPIO PC5=LCD_DC, dedicated GPIO PC4=LCD_RST) at 10.0 MHz SPI1 clock, with J2.16 (IM1)=+3V3, J2.17 (IM2)=+3V3, J2.18 (IM0)=GND (IM[2:0]=110 for 4-wire 8-bit serial SPI), backlight anode J2.12 (LEDA) powered from /VSYS, and cathodes J2.2..5 (LEDK1..LEDK4) switched via four individual 100 ohm 1% 0603 ballast resistors (R9, R46, R47, R48, 0603WAF1000T5E C22775) and 2.5V logic-level N-MOSFET Q2 (AO3400A C20917) on PB0 (TIM3_CH3)"
    reason: "With the LCD seated face-up above the PCB and its 18-pin 0.5mm FPC tail folding 180 deg around the top horizontal board edge (y=0) into J2 (FH12-18S-0.5SH(55), bottom-contact, rot_deg=180), the contact face flips to bottom-contact (-z) with no left-right conductor reversal (conductor 1 at x=33.25mm mates with J2.1 GND, pins 2..5=LEDK1..LEDK4, 6=LCD_RST/PC4, 7=LCD_CS/PA4, 8=LCD_DC/PC5, 9=LCD_SCK/PA5, 10=LCD_SDA/PA7, 11=LCD_SDO/PA6, 12=LEDA/VSYS, 13=VDD/+3V3, 14=GND, 15=VDDI/+3V3, 16=IM1/+3V3, 17=IM2/+3V3, 18=IM0/GND setting IM[2:0]=110 / IM[3:0]=1110 for 4-wire 8-bit serial SPI per Ilitek ILI9341 datasheet Section 7.1). Powering J2.12 (LEDA) from /VSYS (3.7-4.95V) instead of +3V3 provides headroom above the 3.0-3.2V white LED VF and removes PWM switching ripple from +3V3; four individual 100 Ohm 1% 0603 ballast resistors (R9, R46, R47, R48, 0603WAF1000T5E C22775) limit per-LED current on USB power (V_SYS = 4.70V typ, 4.95V max) to 16.0mA/LED typ (64.0mA total) and 19.5mA/LED max (78.0mA total) at 100% duty cycle, within the ER-TFT024-3 15-20mA/LED typical specification and < 25mA/LED absolute maximum DC rating."
  - question: "Firmware flashing and boot recovery path?"
    choice: "Native USB 2.0 Full-Speed DFU over USB-C receptacle J1 (PA11/USB_DM, PA12/USB_DP through USBLC6-2SC6 ESD array U4) with 12 MHz CL=9pF ESR=60Ohm HSE crystal Y1 (TXM12M0004322CBCDO00T, C362368) and C1=C2=12pF load capacitors (C1547), external button-chord hardware DFU strap (series P-MOSFETs Q12/Q13 AO3401A from /+3V3 to /BOOT0 gated by external buttons SW9 Select and SW13 R2, plus N-MOSFET Q14 AO3400A with Gate on /BOOT0, Source on SW8 B, Drain on /NRST so holding Select+R2 and tapping B enters ROM USB DFU without opening the press-fit enclosure), internal tactile switches SW15 (BOOT0) and SW16 (NRST) + SWD/DFU test pads TP1..TP6 for bare-PCBA bring-up prior to LCD assembly, and external 10k pull-up resistors (R33..R45, R19) + dual 5V bidirectional ESD TVS diodes (D6..D12, PESD5V0S2BT C2687130) on all 14 user buttons"
    reason: "Per ST RM0402 Section 2.4 and AN2606 Table 85, STM32F412RET6 boots into its factory-ROM USB OTG FS DFU bootloader when BOOT0=1 and BOOT1=0 at reset with a 12 MHz HSE crystal on PH0/PH1, provided active bootloader peripheral pins (USART1/2/3 RX, I2C1/3 SCL/SDA on PB6/PB7/PA8/PC9, and CAN2_RX on PB5) are held idle high via external 10k pull-ups (R25..R29 and button pull-ups R33..R45). Because SW15, SW16, and TP1..TP6 sit beneath the LCD module inside the press-fit CNC shell (used for bare-PCBA programming before LCD installation), adding series P-MOSFETs Q12 (Gate on /BTN_SELECT) and Q13 (Gate on /BTN_R2) from /+3V3 to /BOOT0 together with N-MOSFET Q14 (Gate on /BOOT0, Source on /BTN_B, Drain on /NRST) provides non-invasive external hardware recovery: holding Select + R2 pulls /BOOT0 high (3.3V across R8=10k), and pressing/releasing B pulls /NRST low via Q14 and releases /NRST with BOOT0=1 to enter ROM USB DFU mode from outside the sealed enclosure."
