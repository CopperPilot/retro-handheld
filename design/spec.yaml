    travel_mm: 25
    may_touch: [pcba]
    held_by: captured
    note: "Cross D-pad seated over SW1..SW4 and captured by front_shell cutout flange"
  - part: action_buttons
    direction: [0, 0, -1]
    travel_mm: 25
    may_touch: [pcba]
    held_by: captured
